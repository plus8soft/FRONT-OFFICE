apply plugin: 'war'
apply plugin: 'idea'

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/generated/sources/annotationProcessor/java/main"
        }
    }
}

tasks.named('compileJava') {
    options.annotationProcessorGeneratedSourcesDirectory = file("$buildDir/generated/sources/annotationProcessor/java/main")
    // Enable annotation processing (enabled by default, but explicitly specified)
    options.compilerArgs += ['-parameters'] // Preserve parameter names for reflection
    // Ensure annotation processor can see all necessary classes
    options.annotationProcessorPath = configurations.annotationProcessor
}

idea {
    module {
        excludeDirs -= file("$buildDir")
        sourceDirs += file("$buildDir/generated/sources/annotationProcessor/java/main")
    }
}
war {
    manifest.attributes("version": { ->
        try {
            def outputStream = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'rev-parse', 'HEAD'
                standardOutput = outputStream
                ignoreExitValue = true
            }
            def version = outputStream.toString().trim()
            return version ?: project.version
        } catch (Exception e) {
            return project.version
        }
    }())
}
configurations {
    implementation.exclude group: 'javax.enterprise', module: 'cdi-api'
    implementation.exclude group: 'org.aspectj', module: 'aspectjrt'
    implementation.exclude group: 'commons-logging', module: 'commons-logging'
}
dependencies {
    compileOnly 'javax.servlet:javax.servlet-api:3.1.0'
    compileOnly 'javax.el:javax.el-api:3.0.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'javax.xml.bind:jaxb-api:2.3.1'
    compileOnly 'javax.xml.soap:javax.xml.soap-api:1.4.0'
    // Lombok updated for Java 11 compatibility (1.16.10 doesn't work with Java 11)
    compileOnly 'org.projectlombok:lombok:1.18.24'
    // JPA API needed for entity class compilation and annotation processor work
    compileOnly 'org.hibernate.javax.persistence:hibernate-jpa-2.1-api:1.0.0.Final'
    // Hibernate JPA Model Generator needed in compileClasspath for work
    compileOnly 'org.hibernate:hibernate-jpamodelgen:5.2.11.Final'
    // Hibernate core needed in compileOnly for annotation processor work (but not in annotationProcessor to avoid conflicts)
    compileOnly 'org.hibernate:hibernate-core:5.2.11.Final'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.hibernate:hibernate-jpamodelgen:5.2.11.Final'
    annotationProcessor 'org.hibernate:hibernate-core:5.2.11.Final'
    // Dependencies for annotation processor
    annotationProcessor 'javax.annotation:javax.annotation-api:1.3.2'
    annotationProcessor 'javax.xml.bind:jaxb-api:2.3.1'
    // JPA API needed for hibernate-jpamodelgen
    annotationProcessor 'org.hibernate.javax.persistence:hibernate-jpa-2.1-api:1.0.0.Final'
    implementation 'com.sun.mail:javax.mail:1.5.6'
    implementation 'org.glassfish:javax.faces:2.2.8-18'
    implementation 'org.primefaces:primefaces:6.1'
    implementation 'org.omnifaces:omnifaces:1.14'
    implementation 'org.springframework:spring-webmvc:4.3.7.RELEASE'
    implementation 'org.springframework.webflow:spring-faces:2.4.5.RELEASE'
    implementation 'org.springframework:spring-orm:4.3.7.RELEASE'
    implementation 'org.springframework.data:spring-data-jpa:1.11.6.RELEASE'
    implementation 'org.springframework:spring-aspects:4.3.7.RELEASE'
    implementation 'org.springframework:spring-context-support:4.3.7.RELEASE'
    implementation 'org.springframework.security:spring-security-config:4.2.2.RELEASE'
    implementation 'net.sf.ehcache:ehcache:2.7.4'
    implementation 'org.aspectj:aspectjweaver:1.8.10'
    implementation 'org.hibernate:hibernate-java8:5.2.11.Final'
    implementation 'com.mchange:c3p0:0.9.5.2'
    implementation 'org.liquibase:liquibase-core:3.10.3'
    implementation 'org.bouncycastle:bcmail-jdk15on:1.57'
    implementation 'com.google.code.gson:gson:2.8.0'
    implementation 'com.jayway.jsonpath:json-path:2.2.0'
    implementation 'com.itextpdf:layout:7.0.2'
    implementation 'org.apache.logging.log4j:log4j-1.2-api:2.8.2'
    // ms-com-bridge and com4j removed - MsReportService is disabled (requires Windows)
    // JAXB runtime for Java 9+ (may not be needed for Java 8, but added for compatibility)
    implementation('org.glassfish.jaxb:jaxb-runtime:2.3.1') {
        exclude group: 'javax.activation', module: 'javax.activation-api'
    }
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.8.2'
    runtimeOnly 'org.apache.logging.log4j:log4j-jul:2.8.2'
    runtimeOnly 'org.apache.logging.log4j:log4j-jcl:2.8.2'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j-impl:2.8.2'
    runtimeOnly 'org.apache.logging.log4j:log4j-liquibase:2.8.2'
    runtimeOnly project(':primefaces-theme')
    runtimeOnly 'commons-fileupload:commons-fileupload:1.3.2'
    // Microsoft SQL Server JDBC — resolved from Maven Central (no lib/sqljdbc42.jar)
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:12.4.2.jre8'
    runtimeOnly 'org.apache.santuario:xmlsec:1.5.8'
}
