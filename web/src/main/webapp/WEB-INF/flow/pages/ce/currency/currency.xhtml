<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="../ce-template.xhtml">
    <ui:define name="content-body">
        <h1 class="title-page">Currencies</h1>
        <p:panel header="Currency List">
            <f:facet name="actions">
                <span class="icon-block icon_currency"/>
            </f:facet>
            <p:dataTable value="#{currencyView.currencies}" var="currency" rowKey="#{currency.id}" 
                         emptyMessage="No currencies available" paginator="true" rows="20">
                <p:column headerText="">
                    <p:graphicImage value="#{currencyImageRequest.image}" cache="false" width="25px" height="25px"
                                    styleClass="currency_img">
                        <f:param name="id" value="#{currency.id}"/>
                    </p:graphicImage>
                </p:column>
                <p:column headerText="Code">
                    #{currency.id} <b><h:outputText value="(#{currency.alternativeCode})" rendered="#{currency.alternativeCode ne currency.id}"/></b>
                </p:column>
                <p:column headerText="ISO">
                    #{currency.iso}
                </p:column>
                <p:column headerText="Denomination">
                    #{currency.ratio}
                </p:column>
                <p:column headerText="Name" width="300">
                    #{currency.name}
                </p:column>
                <p:column headerText="Position">
                    #{currency.position}
                </p:column>
                <p:column headerText="Enabled">
                    <p:outputLabel value="#{currency.enabled ? 'Yes' : 'No'}"/>
                </p:column>
            </p:dataTable>
        </p:panel>
    </ui:define>
</ui:composition>
