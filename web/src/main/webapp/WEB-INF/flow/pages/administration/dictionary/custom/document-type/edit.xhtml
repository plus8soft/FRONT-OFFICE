<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="../../../administration-template.xhtml">
    <ui:define name="content-body">
        <p:panel header="#{documentTypeEditView.dictionary.group} > #{documentTypeEditView.dictionary.name}">
            <div class="grid_row">
                <div class="grid_cell w_15">
                    <p:outputLabel value="Name" for="@next"/>
                </div>
                <div class="grid_cell w_80">
                    <div class="icon_box">
                        <p:inputText value="#{documentTypeEditView.documentType.name}" required="true" styleClass="w_50">
                            <f:passThroughAttribute name="focus-priority" value="1"/>
                        </p:inputText>
                        <p:message for="@previous" display="icon" styleClass="mlm-w_50"/>
                    </div>
                    <script>focusByPriority();</script>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_15">
                    <p:importEnum type="java.time.temporal.ChronoUnit"/>
                    <p:outputLabel value="Validity Period" for="@next"/>
                </div>
                <div class="grid_cell w_20">
                    <div class="icon_box">
                        <p:selectOneMenu id="termType" value="#{documentTypeEditView.documentType.termType}"
                                         disabled="#{documentTypeEditView.documentType.termless}"
                                         required="#{not documentTypeEditView.documentType.termless}" autoWidth="false" styleClass="w_90">
                            <f:selectItem itemValue="#{null}" itemLabel=""/>
                            <f:selectItem itemValue="#{ChronoUnit.MINUTES}" itemLabel="Minutes"/>
                            <f:selectItem itemValue="#{ChronoUnit.HOURS}" itemLabel="Hours"/>
                            <f:selectItem itemValue="#{ChronoUnit.DAYS}" itemLabel="Days"/>
                            <f:selectItem itemValue="#{ChronoUnit.MONTHS}" itemLabel="Months"/>
                        </p:selectOneMenu>
                        <p:message for="@previous" display="icon" styleClass="mlm-w_10"/>
                    </div>
                </div>
                <div class="grid_cell w_20">
                    <div class="icon_box">
                        <p:inputNumber id="term" value="#{documentTypeEditView.documentType.term}"
                                       disabled="#{documentTypeEditView.documentType.termless}"
                                       required="#{not documentTypeEditView.documentType.termless}" styleClass="w_100" decimalPlaces="0"/>
                        <p:message for="@previous" display="icon"/>
                    </div>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_15">
                    <p:outputLabel value="Required" for="@next"/>
                </div>
                <div class="grid_cell">
                    <p:selectBooleanCheckbox value="#{documentTypeEditView.documentType.required}"/>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_15">
                    <p:outputLabel value="Unlimited" for="@next"/>
                </div>
                <div class="grid_cell">
                    <p:selectBooleanCheckbox value="#{documentTypeEditView.documentType.termless}">
                        <p:ajax listener="#{documentTypeEditView.onTermlessChanged()}"
                                update="termType termType:@previous term @(.icon_box > .ui-message)"/>
                    </p:selectBooleanCheckbox>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_15">
                    <p:outputLabel value="Document Not Used" for="@next"/>
                </div>
                <div class="grid_cell">
                    <p:selectBooleanCheckbox value="#{documentTypeEditView.documentType.disabled}"/>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_15">
                    Report Template
                </div>
                <div class="grid_cell w_40">
                    <p:selectOneMenu value="#{documentTypeEditView.documentType.reportTemplate}" converter="omnifaces.SelectItemsConverter"
                                     autoWidth="false" styleClass="w_100 ">
                        <f:selectItem itemValue="#{null}" itemLabel=""/>
                        <f:selectItems value="#{documentTypeEditView.templates}" var="template" itemLabel="#{template.name}" itemValue="#{template}"/>
                    </p:selectOneMenu>
                </div>
            </div>
        </p:panel>
        <div class="navigation_panel clearfix bottom">
            <p:commandButton value="Save" action="#{documentTypeEditView.save()}" styleClass="r-float_elem blue-btn big_btn"
                             update="@(.icon_box .ui-widget) @(.icon_box > .ui-message)"/>
            <p:commandButton value="Cancel" styleClass="orange-btn big_btn" action="cancel" immediate="true" process="@this"/>
        </div>
    </ui:define>
</ui:composition>
