<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="../../administration-template.xhtml">
    <ui:define name="content-body">
        <h1 class="title-page">Module Users</h1>
        <p:panel header="Select a task and perform the necessary actions">
            <f:facet name="actions">
                <span class="icon-block icon_currency"/>
            </f:facet>
            <div class="navigation_panel clearfix">
                <p:commandButton value="View" action="show" disabled="#{empty moduleUserView.selectedTask}"
                                 styleClass="blue-btn"/>
            </div>
            <p:treeTable value="#{moduleUserView.treeTask}" var="node" nodeVar="treeNode" selectionMode="single"
                         selection="#{moduleUserView.selectedTask}" emptyMessage="No data">
                <p:ajax event="select" update="@(.ui-button)"/>
                <p:columnGroup type="header">
                    <p:row>
                        <p:column rowspan="2" headerText="Task Name"/>
                        <p:column colspan="2" headerText="Users"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="Active"/>
                        <p:column headerText="Blocked"/>
                    </p:row>
                </p:columnGroup>
                <p:column>
                    <p:treeNode type="group" rendered="#{treeNode.type eq 'group'}">
                        #{node.project.name}
                    </p:treeNode>
                    <p:treeNode rendered="#{treeNode.type eq 'default'}">
                        #{node.task.name}
                    </p:treeNode>
                </p:column>
                <p:column>
                    #{node.activeCount}
                </p:column>
                <p:column>
                    #{node.blockedCount}
                </p:column>
            </p:treeTable>
        </p:panel>
    </ui:define>
</ui:composition>
