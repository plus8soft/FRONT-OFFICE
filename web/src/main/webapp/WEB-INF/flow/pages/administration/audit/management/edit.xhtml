<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui" xmlns:h="http://java.sun.com/jsf/html"
                template="../../administration-template.xhtml">
    <ui:define name="content-body">
        <h1 class="title-page">Audit Settings</h1>
        <p:panel header="Select events that should be logged in the Audit Log">
            <f:facet name="actions">
                <span class="icon-block icon_currency"/>
            </f:facet>
            <p:importEnum type="web.entity.core.EventType"/>
            <p:dataTable value="#{editView.eventSettings}" var="event" emptyMessage="No data">
                <p:column headerText="Code">
                    #{event.code.code}: #{eventCodeDictionary.findOne(event.code).value}
                </p:column>
                <p:column headerText="Event Description">
                    #{event.description}
                </p:column>
                <p:column headerText="Log Type" width="110">
                    <h:outputText value="System" rendered="#{EventType.SYSTEM eq event.type}"/>
                    <h:outputText value="User" rendered="#{EventType.USER eq event.type}"/>
                </p:column>
                <p:column headerText="Log Event" width="80">
                    <span class="fix_row align-center">
                        <ui:fragment rendered="#{event.editable}">
                            <i class="fa fa-check success" aria-hidden="true"/>
                        </ui:fragment>
                        <ui:fragment rendered="#{not event.editable}">
                            <p:selectBooleanCheckbox value="#{event.enabled}">
                                <p:ajax listener="#{editView.setChangeData(true)}" update="@(.ui-button)"/>
                            </p:selectBooleanCheckbox>
                        </ui:fragment>
                    </span>
                </p:column>
            </p:dataTable>
        </p:panel>
        <div class="navigation_panel bottom clearfix">
            <p:commandButton value="Save" action="#{editView.save()}" disabled="#{!editView.changeData}"
                             styleClass="r-float_elem big_btn blue-btn"/>
            <p:commandButton value="Cancel" action="event-setting" styleClass="big_btn orange-btn" process="@this"/>
        </div>
    </ui:define>
</ui:composition>
