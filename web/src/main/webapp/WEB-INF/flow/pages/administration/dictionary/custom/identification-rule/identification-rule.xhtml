<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="../../../administration-template.xhtml">
    <ui:define name="content-body">
        <p:panel header="#{identificationRuleView.dictionary.group} > #{identificationRuleView.dictionary.name}">
            <f:facet name="actions">
                <span class="icon-block icon_currency"/>
            </f:facet>
            <div class="navigation_panel clearfix">
                <p:commandButton value="Edit" action="edit" disabled="#{empty identificationRuleView.selected}" styleClass="blue-btn"/>
            </div>
            <p:dataTable value="#{identificationRuleView.identificationRules}" var="rule" rowKey="#{rule.id}" selectionMode="single"
                         selection="#{identificationRuleView.selected}" emptyMessage="No data">
                <p:ajax event="rowSelect" update="@(.ui-button:first)"/>
                <p:ajax event="rowUnselect" update="@(.ui-button:first)"/>
                <p:columnGroup type="header">
                    <p:row>
                        <p:column rowspan="2" headerText="Module Name, Task"/>
                        <p:column rowspan="2" headerText="Rule Description"/>
                        <p:column colspan="2" headerText="Rule Range"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="Minimum Amount, USD"/>
                        <p:column headerText="Maximum Amount, USD"/>
                    </p:row>
                </p:columnGroup>
                <p:column>
                    #{rule.task.name}
                </p:column>
                <p:column>
                    #{rule.name}
                </p:column>
                <p:column>
                    <h:outputText value="#{rule.min}">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                    </h:outputText>
                </p:column>
                <p:column>
                    <h:outputText value="#{rule.max}" rendered="#{not empty rule.max}">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                    </h:outputText>
                    <h:outputText value="&#8734;" rendered="#{empty rule.max}"/>
                </p:column>
            </p:dataTable>
        </p:panel>
        <div class="navigation_panel bottom">
            <p:commandButton value="Back" action="back" styleClass="orange-btn big_btn" process="@this"/>
        </div>
    </ui:define>
</ui:composition>
