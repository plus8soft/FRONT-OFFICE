<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                template="../../administration-template.xhtml">
    <ui:define name="content-body">
        <h1 class="title-page">#{rightEditView.right.groupName} > #{rightEditView.right.name}</h1>
        <p:panel header="Users" toggleable="true">
            <div class="navigation_panel box_big_subpanel clearfix">
                <div class="search_box">

                    <p:outputLabel for="@next" value="Search:"/>
                    <p:inputText value="#{rightEditView.filter.textFilter}" placeholder="Search by name, login"
                                 onkeypress="if(event.keyCode === 13) { updateTable(); return false;}"/>
                    <p:remoteCommand name="updateTable" action="#{rightEditView.fastSearch()}" update="@parent"/>
                    <i class="fa fa-search fa-flip-horizontal" aria-hidden="true"/>
                </div>
            </div>
            <p:panel toggleable="true" styleClass="subpanel" collapsed="true" header="Advanced Search">
                <div class="grid_row">
                    <div class="grid_cell w_15">
                        <p:outputLabel for="@next" value="Activity Date, until"/>
                    </div>
                    <div class="grid_cell w_15">
                        <div class="icon_box">
                            <p:calendar value="#{rightEditView.filter.lastLoginEventDate}" converter="javax.faces.Instant" pattern="dd.MM.yyyy HH:mm"
                                        timeZone="#{userSession.user.department.zoneId}" showOn="button" placeholder="dd.mm.yyyy hh:mm" mask="true"
                                        styleClass="w_100"/>
                            <p:message for="@previous" display="icon"/>
                        </div>
                    </div>
                    <div class="grid_cell w_5 ml-w_5">
                        <p:outputLabel for="@next" value="Status"/>
                    </div>
                    <div class="grid_cell w_25">
                        <p:selectOneMenu value="#{rightEditView.filter.status}" styleClass="w_100" autoWidth="false">
                            <f:selectItem itemValue="#{null}" itemLabel=""/>
                            <f:selectItems value="#{userStatusDictionary.findAll()}" var="status" itemLabel="#{status.value}"
                                           itemValue="#{status.code}" itemDisabled="#{status.unused}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="grid_cell w_10 ml-w_5">
                        <p:outputLabel for="@next" value="Position"/>
                    </div>
                    <div class="grid_cell w_20">
                        <p:selectOneMenu styleClass="w_100" value="#{rightEditView.filter.position}" converter="javax.faces.Integer"
                                         autoWidth="false">
                            <f:selectItem itemValue="#{null}" itemLabel=""/>
                            <f:selectItems value="#{userJobPositionDictionary.findAll()}" var="position" itemValue="#{position.code}"
                                           itemLabel="#{position.value}" itemDisabled="#{position.unused}"/>
                        </p:selectOneMenu>
                    </div>
                </div>
                <div class="btn_box clearfix">
                    <p:defaultCommand target="@next" scope="@parent"/>
                    <p:commandButton value="Search" action="#{rightEditView.extendedSearch()}" update="@parent:@parent" process="@parent"
                                     styleClass="blue-btn r-float_elem"/>
                </div>
            </p:panel>
            <p:dataTable id="users" value="#{rightEditView.model}" var="user" lazy="true" rows="100" scrollRows="50" sortMode="multiple"
                         scrollable="#{rightEditView.model.rowCount gt 10}" virtualScroll="true"
                         scrollHeight="#{rightEditView.model.rowCount gt 10 ? 400 : null}" emptyMessage="No data">
                <p:column headerText="Login">
                    #{user.login}
                </p:column>
                <p:column headerText="Name, Position">
                    #{user.lastname} #{user.firstname} #{user.patronymic}<br/>#{userJobPositionDictionary.findOne(user.position).value}
                </p:column>
                <p:column headerText="Activity Date">
                    <h:outputText value="#{user.lastLoginEventDate}">
                        <f:converter converterId="javax.faces.Instant"/>
                        <f:attribute name="pattern" value="dd.MM.yyyy HH:mm:ss"/>
                        <f:attribute name="timeZone" value="#{userSession.user.department.zoneId}"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Status">
                    #{userStatusDictionary.findOne(user.status).value}
                </p:column>
            </p:dataTable>
        </p:panel>
        <p:panel header="Roles" toggleable="true">
            <p:tree value="#{rightEditView.roleTree}" var="node" animate="true" selectionMode="checkbox" selection="#{rightEditView.selectedRoles}">
                <p:treeNode type="empty">#{node}</p:treeNode>
                <p:treeNode type="group">#{node}</p:treeNode>
                <p:treeNode>#{node.name}</p:treeNode>
            </p:tree>
        </p:panel>
        <div class="btn_box">
            <p:commandButton value="Save" action="#{rightEditView.save}" styleClass="blue-btn big_btn r-float_elem"/>
            <p:commandButton value="Cancel" action="to-right" styleClass="orange-btn big_btn" process="@this"/>
        </div>
    </ui:define>
</ui:composition>
