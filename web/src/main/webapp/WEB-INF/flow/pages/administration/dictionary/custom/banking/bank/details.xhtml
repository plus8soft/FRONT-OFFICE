<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                template="../../../../administration-template.xhtml">
    <ui:define name="content-body">
        <p:panel header="Banking Dictionaries > Banks > Details">
            <p class="strike_title"><span>Bank Name</span></p>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>Full:</b></div>
                <div class="grid_cell w_70">#{bank.name}</div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>Short:</b></div>
                <div class="grid_cell w_70">#{bank.shortName}</div>
            </div>
            <p class="strike_title"><span>Details</span></p>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>Routing Number:</b></div>
                <div class="grid_cell w_70">#{bank.routingNumber}</div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>Correspondent Account:</b></div>
                <div class="grid_cell w_70"><h:outputText value="#{bank.correspondentAccount}" converter="CorrespondentAccount"/></div>
            </div>
            <p class="strike_title"><span>Contact Information</span></p>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>Address:</b></div>
                <div class="grid_cell w_70">
                    #{bank.postalCode}, #{bank.address}
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>Phone:</b></div>
                <div class="grid_cell w_70">#{bank.phone}</div>
            </div>
            <p class="strike_title"><span>Data Changes</span></p>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>Added to Dictionary:</b></div>
                <div class="grid_cell w_70">
                    <h:outputText value="#{bank.createDate}">
                        <f:converter converterId="javax.faces.LocalDateConverter"/>
                        <f:attribute name="pattern" value="dd.MM.yyyy"/>
                    </h:outputText>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>Last Update:</b></div>
                <div class="grid_cell w_70">
                    <h:outputText value="#{bank.updateDate}">
                        <f:converter converterId="javax.faces.LocalDateConverter"/>
                        <f:attribute name="pattern" value="dd.MM.yyyy"/>
                    </h:outputText>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_30"><b>External Rate Information Update:</b></div>
                <div class="grid_cell w_70">
                    <h:outputText value="#{bank.actualDate}">
                        <f:converter converterId="javax.faces.LocalDateConverter"/>
                        <f:attribute name="pattern" value="dd.MM.yyyy"/>
                    </h:outputText>
                </div>
            </div>
        </p:panel>
        <div class="navigation_panel bottom clearfix">
            <p:commandButton value="Back" action="back" styleClass="orange-btn big_btn" process="@this"/>
        </div>
    </ui:define>
</ui:composition>
