<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="../../../administration-template.xhtml">
    <ui:define name="content-body">
        <p:panel header="#{identificationRuleEditView.dictionary.group} > #{identificationRuleEditView.dictionary.name}">
            <div class="grid_row">
                <div class="grid_cell w_15">
                    <p:outputLabel value="Rule Description" for="@next"/>
                </div>
                <div class="grid_cell w_80">
                    <p:inputText value="#{identificationRuleEditView.rule.name}" disabled="true" styleClass="w_50"/>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_15">
                    <p:outputLabel for="@next" value="Minimum Amount"/>
                </div>
                <div class="grid_cell w_80">
                    <div class="icon_box">
                        <p:inputNumber value="#{identificationRuleEditView.rule.min}" required="true" minValue="0" styleClass="w_50">
                            <f:passThroughAttribute name="focus-priority" value="1"/>
                        </p:inputNumber>
                        <p:message for="@previous" display="icon" styleClass="mlm-w_50"/>
                        <script>focusByPriority();</script>
                    </div>
                </div>
            </div>
            <div class="grid_row">
                <div class="grid_cell w_15">
                    <p:outputLabel for="@next" value="Maximum Amount"/>
                </div>
                <div class="grid_cell w_80">
                    <p:inputNumber value="#{identificationRuleEditView.rule.max}" emptyValue="sign" minValue="0" styleClass="w_50"/>
                </div>
            </div>
        </p:panel>
        <div class="navigation_panel clearfix bottom">
            <p:commandButton value="Save" action="#{identificationRuleEditView.save()}" styleClass="r-float_elem blue-btn big_btn"
                             update="@form"/>
            <p:commandButton value="Cancel" action="cancel" styleClass="orange-btn big_btn" immediate="true" process="@this"/>
        </div>
    </ui:define>
</ui:composition>
