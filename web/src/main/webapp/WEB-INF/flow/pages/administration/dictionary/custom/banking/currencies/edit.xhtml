<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="../../../../administration-template.xhtml">
    <ui:define name="content-body">
        <p:panel header="Define Currency Parameters">
            <f:facet name="actions">
                <span class="icon-block icon_currency"/>
            </f:facet>
            <div class="form_box">
                <div class="curency_image">
                    <p:fileUpload fileUploadListener="#{editView.uploadIcon}" update="@form" auto="true" styleClass="file-upload"
                                  style="display: none"/>
                    <h:graphicImage url="data:image/jpg;base64,#{editView.toBase64(editView.currency.image)}" width="150px"
                                    height="150px" onclick="$('#content').find('.file-upload input').click()" styleClass="currency_img"/>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_10">
                        <p:outputLabel for="@next" value="Code"/>
                    </div>
                    <div class="grid_cell w_20">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.id}" styleClass="w_100" readonly="#{editView.editing}" required="true"
                                         maxlength="3">
                                <p:keyFilter regEx="/\d/" preventPaste="false"/>
                                <f:validateLength minimum="3"/>
                                <f:passThroughAttribute name="focus-priority" value="1"/>
                            </p:inputText>
                            <p:message for="@previous"/>
                            <script>focusByPriority();</script>
                        </div>
                    </div>
                    <div class="grid_cell w_15 ml-w_5">
                        <p:outputLabel for="@next" value="Alternative Code"/>
                    </div>
                    <div class="grid_cell w_20">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.alternativeCode}" required="true" maxlength="3" styleClass="w_100">
                                <p:keyFilter regEx="/\d/" preventPaste="false"/>
                                <f:validateLength minimum="3"/>
                            </p:inputText>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                    <div class="grid_cell w_5 ml-w_5">
                        <p:outputLabel for="@next" value="ISO"/>
                    </div>
                    <div class="grid_cell w_20">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.iso}" styleClass="w_100" required="true"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_10">
                        <p:outputLabel for="@next" value="Name"/>
                    </div>
                    <div class="grid_cell w_25">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.name}" styleClass="w_100" required="true"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                    <div class="grid_cell w_10 ml-w_5">
                        <p:outputLabel for="@next" value="Denomination"/>
                    </div>
                    <div class="grid_cell w_20">
                        <div class="message_box">
                            <p:inputNumber decimalPlaces="0" value="#{editView.currency.ratio}" required="true" minValue="0" styleClass="w_100"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_20">
                        <p:outputLabel value="Integral Fraction Name Gender"/>
                    </div>
                    <div class="grid_cell w_80">
                        <p:selectOneRadio value="#{editView.currency.male}">
                            <f:selectItem itemLabel="M" itemValue="#{true}"/>
                            <f:selectItem itemLabel="F" itemValue="#{false}"/>
                        </p:selectOneRadio>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_50">
                        <p:outputLabel for="@next" value="Integral Fraction Name in Nominative Case"/>
                    </div>
                    <div class="grid_cell w_50">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.integralCase.nominative}" required="true" styleClass="w_100"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_50">
                        <p:outputLabel for="@next" value="Integral Fraction Name in Genitive Case"/>
                    </div>
                    <div class="grid_cell w_50">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.integralCase.genitive}" required="true" styleClass="w_100"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_50">
                        <p:outputLabel for="@next" value="Integral Fraction Name in Plural Genitive Case"/>
                    </div>
                    <div class="grid_cell w_50">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.integralCase.plural}" required="true" styleClass="w_100"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_50">
                        <p:outputLabel for="@next" value="Fractional Fraction Name in Nominative Case"/>
                    </div>
                    <div class="grid_cell w_50">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.fractionCase.nominative}" required="true" styleClass="w_100"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_50">
                        <p:outputLabel for="@next" value="Fractional Fraction Name in Genitive Case"/>
                    </div>
                    <div class="grid_cell w_50">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.fractionCase.genitive}" required="true" styleClass="w_100"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_50">
                        <p:outputLabel for="@next" value="Fractional Fraction Name in Plural Genitive Case"/>
                    </div>
                    <div class="grid_cell w_50">
                        <div class="message_box">
                            <p:inputText value="#{editView.currency.fractionCase.plural}" required="true" styleClass="w_100"/>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
                <div class="row grid_row">
                    <div class="grid_cell w_50">
                        <p:outputLabel for="@next" value="Currency Active"/>
                    </div>
                    <div class="grid_cell w_50">
                        <div class="message_box">
                            <p:selectBooleanCheckbox value="#{editView.currency.enabled}" styleClass="w_100"
                                                     disabled="#{'840' eq editView.currency.id}">
                                <f:attribute name="currency" value="#{editView.currency}"/>
                            </p:selectBooleanCheckbox>
                            <p:message for="@previous"/>
                        </div>
                    </div>
                </div>
            </div>
        </p:panel>
        <div class="navigation_panel clearfix bottom">
            <p:commandButton value="Save" action="#{editView.save()}" update="@form" styleClass="blue-btn big_btn r-float_elem"/>
            <p:commandButton value="Cancel" action="cancel" immediate="true" styleClass="orange-btn big_btn" process="@this"/>
        </div>
    </ui:define>
</ui:composition>
