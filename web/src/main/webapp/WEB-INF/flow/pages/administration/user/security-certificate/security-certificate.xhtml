<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="../../administration-template.xhtml">
    <ui:define name="content-body">
        <section class="certificate_page">
            <h1 class="title-page">
                <h:outputText value="Security Certificates"/>
            </h1>
            <p:panel header="Search for the required certificate">
                <f:facet name="actions">
                    <span class="icon-block icon_currency"/>
                </f:facet>
                <div class="navigation_panel box_big_subpanel clearfix">
                    <div class="search_box">
                        <p:defaultCommand target="search"/>
                        <p:outputLabel for="@next" value="Search:"/>
                        <p:inputText id="search" value="#{securityCertificateView.filter.textFilter}" placeholder="Search by name, login"
                                     onkeypress="if(event.keyCode === 13) { updateTable(); return false;}">
                            <f:passThroughAttribute name="focus-priority" value="1"/>
                        </p:inputText>
                        <script>focusByPriority();</script>
                        <p:remoteCommand name="updateTable" action="#{securityCertificateView.fastSearch()}" update="@form"/>
                        <i class="fa fa-search fa-flip-horizontal" aria-hidden="true"/>
                    </div>
                </div>
                <p:panel toggleable="true" collapsed="true" header="Advanced Search" styleClass="subpanel">
                    <div class="grid_row">
                        <div class="grid_cell w_10">
                            <p:outputLabel value="Valid period, from"/>
                        </div>
                        <div class="grid_cell w_15">
                            <div class="icon_box">
                                <p:calendar value="#{securityCertificateView.filter.startDate}" converter="javax.faces.Instant" pattern="dd.MM.yyyy"
                                            timeZone="#{userSession.user.department.zoneId}" showOn="button" placeholder="dd.mm.yyyy" mask="true"
                                            styleClass="w_100"/>
                                <p:message for="@previous" display="icon"/>
                            </div>
                        </div>
                        <div class="grid_cell w_5 r-label">
                            <p:outputLabel value="to"/>
                        </div>
                        <div class="grid_cell w_15">
                            <div class="icon_box">
                                <p:calendar value="#{securityCertificateView.filter.endDate}" converter="javax.faces.Instant" pattern="dd.MM.yyyy"
                                            timeZone="#{userSession.user.department.zoneId}" showOn="button" placeholder="dd.mm.yyyy" mask="true"
                                            styleClass="w_100"/>
                                <p:message for="@previous" display="icon"/>
                            </div>
                        </div>
                        <div class="grid_cell w_15 r-label">
                            <p:outputLabel value="Serial Number"/>
                        </div>
                        <div class="grid_cell w_15">
                            <p:inputText value="#{securityCertificateView.filter.serialNumber}" styleClass="w_100"/>
                        </div>
                        <div class="grid_cell w_10 r-label">
                            <p:outputLabel value="Status"/>
                        </div>
                        <div class="grid_cell w_15">
                            <p:selectOneMenu value="#{securityCertificateView.filter.locked}" autoWidth="false" styleClass="w_100">
                                <f:selectItem itemValue="#{null}" itemLabel=""/>
                                <f:selectItems value="#{certificateStatusDictionary.findAll()}" var="status" itemLabel="#{status.value}"
                                               itemValue="#{1 == status.code ? true : false}"/>
                            </p:selectOneMenu>
                        </div>
                    </div>
                    <p class="strike_title"><span>User Parameters</span></p>
                    <div class="grid_row">
                        <div class="grid_cell w_5">
                            <p:outputLabel value="Status"/>
                        </div>
                        <div class="grid_cell w_20">
                            <p:selectCheckboxMenu value="#{securityCertificateView.filter.userStatuses}" label="" filter="true"
                                                  filterMatchMode="startsWith" updateLabel="true" styleClass="w_100">
                                <f:selectItems value="#{userStatusDictionary.findAll()}" var="status" itemLabel="#{status.value}"
                                               itemValue="#{status.code}"/>
                            </p:selectCheckboxMenu>
                        </div>
                        <div class="grid_cell w_10 ml-w_5">
                            <p:outputLabel for="@next:@next" value="Valid until"/>
                        </div>
                        <div class="grid_cell w_15">
                            <div class="icon_box">
                                <p:calendar value="#{securityCertificateView.filter.expirationDate}" converter="javax.faces.Instant"
                                            pattern="dd.MM.yyyy" timeZone="#{userSession.user.department.zoneId}" showOn="button"
                                            placeholder="dd.mm.yyyy" mask="true" styleClass="w_100"/>
                                <p:message for="@previous" display="icon"/>
                            </div>
                        </div>
                        <div class="grid_cell w_15 ml-w_5">
                            <p:outputLabel value="Security Profile"/>
                        </div>
                        <div class="grid_cell w_25">
                            <p:selectCheckboxMenu value="#{securityCertificateView.filter.securityProfiles}" label="" filter="true"
                                                  filterMatchMode="startsWith" converter="omnifaces.SelectItemsConverter"
                                                  updateLabel="true" styleClass="w_100">
                                <f:selectItems value="#{securityCertificateView.securityProfiles}" var="securityProfile"
                                               itemLabel="#{securityProfile.name}"
                                               itemValue="#{securityProfile}"/>
                            </p:selectCheckboxMenu>
                        </div>
                    </div>
                    <p class="strike_title"><span>Department Parameters</span></p>
                    <div class="grid_row">
                        <div class="grid_cell w_10">
                            <p:outputLabel value="Department"/>
                        </div>
                        <div class="grid_cell w_45">
                            <p:selectCheckboxMenu value="#{securityCertificateView.filter.departmentByNames}" label="" filter="true"
                                                  filterMatchMode="startsWith" converter="omnifaces.SelectItemsConverter"
                                                  updateLabel="true" styleClass="w_100">
                                <f:selectItems value="#{securityCertificateView.departments}" var="department" itemLabel="#{department.name}"
                                               itemValue="#{department}"/>
                            </p:selectCheckboxMenu>
                        </div>
                        <div class="grid_cell w_15 ml-w_5">
                            <p:outputLabel value="Department Code"/>
                        </div>
                        <div class="grid_cell w_25">
                            <p:selectCheckboxMenu value="#{securityCertificateView.filter.departmentByCodes}" label="" filter="true"
                                                  filterMatchMode="startsWith" converter="omnifaces.SelectItemsConverter"
                                                  updateLabel="true" styleClass="w_100">
                                <f:selectItems value="#{securityCertificateView.departments}" var="department" itemLabel="#{department.unitCode}"
                                               itemValue="#{department}"/>
                            </p:selectCheckboxMenu>
                        </div>
                    </div>
                    <div class="btn_box clearfix">
                        <p:defaultCommand target="@next" scope="@parent"/>
                        <p:commandButton value="Search" action="#{securityCertificateView.extendedSearch}" update="@form"
                                         styleClass="blue-btn r-float_elem"/>
                    </div>
                </p:panel>
                <p:dataTable id="certificates" var="certificate" value="#{securityCertificateModel}" lazy="true" rows="100" scrollRows="50"
                             scrollable="#{dictionaryValueModel.rowCount gt 10}" scrollHeight="#{dictionaryValueModel.rowCount gt 10 ? 400 : null}"
                             virtualScroll="true" sortMode="multiple" emptyMessage="No data">
                    <p:columnGroup type="header">
                        <p:column headerText="Serial Number"/>
                        <p:column headerText="Certificate Owner"/>
                        <p:column headerText="Start Date"/>
                        <p:column headerText="End Date"/>
                        <p:column headerText="Status"/>
                        <p:column headerText="Assigned User"/>
                    </p:columnGroup>
                    <p:column>
                        #{certificate.serialNumber}
                    </p:column>
                    <p:column>
                        #{certificate.owner}
                    </p:column>
                    <p:column>
                        <h:outputText value="#{certificate.startDate}">
                            <f:converter converterId="javax.faces.Instant"/>
                            <f:attribute name="pattern" value="dd.MM.yyyy HH:mm:ss"/>
                            <f:attribute name="timeZone" value="#{userSession.user.department.zoneId}"/>
                        </h:outputText>
                    </p:column>
                    <p:column>
                        <h:outputText value="#{certificate.endDate}">
                            <f:converter converterId="javax.faces.Instant"/>
                            <f:attribute name="pattern" value="dd.MM.yyyy HH:mm:ss"/>
                            <f:attribute name="timeZone" value="#{userSession.user.department.zoneId}"/>
                        </h:outputText>
                    </p:column>
                    <p:column>
                        #{certificate.locked ? "Locked" : "Active"}
                    </p:column>
                    <p:column>
                        #{certificate.user.login}
                        <br/>#{utils.strings.joinFio(certificate.user.lastname, certificate.user.firstname, certificate.user.patronymic)}
                    </p:column>
                </p:dataTable>
            </p:panel>
        </section>
    </ui:define>
</ui:composition>
